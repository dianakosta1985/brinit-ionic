<ion-content [fullscreen]="true">
  <div class="flex-center">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Login</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item>
          <ion-input type="email" placeholder="Email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input type="password" placeholder="Password"></ion-input>
        </ion-item>
        <ion-button class="login-button">Login</ion-button>
        <ion-button fill="clear" color="dark"> Forgot password? </ion-button>

        <ion-text class="signup-text">
          <p>Don't have an account? <a href="/register">Register</a></p>
        </ion-text>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
